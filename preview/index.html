<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Miniflux digest · preview</title>
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/tokens-dark.css" />
  <link rel="stylesheet" href="/preview.css" />
</head>
<body>
  <script>
    // ?theme=dark mirrors the Harness dark aliases (tokens-dark.css).
    if (new URLSearchParams(location.search).get('theme') === 'dark') {
      document.body.setAttribute('data-ds-dark-theme', '')
    }
  </script>
  <div id="root"></div>
  <script src="/vendor/react.js"></script>
  <script src="/vendor/react-dom.js"></script>
  <script>
    window.__ModuleLoader__ = { load(definition) { window.__MODULE_DEFINITION__ = definition } }
    window.addEventListener('error', (event) => {
      const box = document.createElement('pre')
      box.style.cssText = 'margin:16px;padding:16px;border:1px solid #f00;border-radius:8px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;color:#b00'
      box.textContent = String(event.error?.stack || event.message || event.error || 'unknown error')
      document.body.appendChild(box)
    })
  </script>
  <script src="/client.js"></script>
  <script>
    const definition = window.__MODULE_DEFINITION__
    if (!definition) throw new Error('client.js did not register a module')
    const mod = definition.factory((name) => {
      if (name === 'react') return window.React
      if (name === 'react-dom') return window.ReactDOM
      throw new Error(`unexpected require(${name})`)
    })
    let Main = null
    let SidebarEntry = null
    const byName = new Map()
    // A stand-in for the shell: sessions that accept a draft, a workspace list,
    // and the two standard panel props (SessionProvider + renderSlot).
    window.__drafts = []
    window.__sessionCreates = 0
    window.__scope = {
      sidebarRight: {
        openResource: (url) => { window.__fallbackOpen = url; window.__openResourceCalls = [...(window.__openResourceCalls || []), url] },
        openTab: (id, options) => { window.__tabOpened = { id, ...options } },
      },
      sidebarRightTabs: {
        get: (id) => (id === 'browser' ? { id: 'browser' } : undefined),
      },
      uiWorkspace: {
        openSession: (id) => { window.__sessionOpened = id },
        workspaces: {
          list: {
            getSnapshot: () => ({ items: [{ workspaceId: 'ws-demo', title: 'default-workspace', path: '/tmp/demo' }] }),
            subscribe: () => () => {},
          },
        },
      },
      sessions: {
        create: async () => { window.__sessionCreates += 1; return `session-${window.__sessionCreates}` },
        retain: (id, options) => ({ id, options, release() {} }),
      },
      uiSession: {
        // Each session gets its own composer draft, like the real binding.
        bindingSource: () => {
          const state = { draft: '' }
          return {
            value: {
              props: {
                inputActions: {
                  setDraft: (text) => { state.draft = text; window.__drafts.push(text) },
                },
              },
              hooks: {
                input: {
                  getSnapshot: () => ({ draft: state.draft, phase: 'plain' }),
                  subscribe: () => () => {},
                },
              },
            },
          }
        },
      },
    }
    const ctx = {
      get: (name) => window.__scope[name],
      inject: (deps, callback) => { callback(window.__scope); return () => {} },
      slots: {
        inject: (key, callback) => { callback(); return () => {} },
        register: (position, component) => {
          if (position.name === 'main') Main = component
          if (position.name === 'sidebar.panellist') SidebarEntry = component
          byName.set(position.name, component)
          return () => {}
        },
      },
    }
    mod.apply(ctx)
    if (!Main) throw new Error('main panel was not registered')
    const fakeSessionProvider = ({ children }) => React.createElement('div', { className: 'fake-session' }, children)
    const renderSlot = (name) => React.createElement('div', { className: 'fake-native', 'data-slot': name },
      React.createElement('div', { 'data-composer-seat': '' },
        React.createElement('div', { 'data-composer-card': '' }, 'fake composer'),
        React.createElement('a', { href: 'https://example.com/post' }, 'external link')))
    // The real shell injects the bridge through the main slot; the preview
    // builds the same surface from window.__scope.
    const mainProps = {
      SessionProvider: fakeSessionProvider,
      renderSlot,
      chat: {
      defaultChatWorkspace: () => 'ws-demo',
        async openChat() {
          window.__sessionCreates += 1
          const id = `session-${window.__sessionCreates}`
          return {
            sessionId: id,
            reference: { id, release() {} },
            release() {},
            async setDraft(prompt) {
              window.__drafts.push(prompt)
            },
          }
        },
      },
    }
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Main, mainProps))
    if (SidebarEntry) {
      const holder = document.createElement('div')
      holder.id = 'sidebar-entry'
      holder.style.display = 'none'
      document.body.appendChild(holder)
      ReactDOM.createRoot(holder).render(React.createElement(SidebarEntry))
    }
  </script>
</body>
</html>
