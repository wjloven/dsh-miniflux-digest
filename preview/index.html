<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Miniflux digest · preview</title>
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/tokens-dark.css" />
  <link rel="stylesheet" href="/preview.css" />
</head>
<body>
  <script>
    // ?theme=dark mirrors the Harness dark aliases (tokens-dark.css).
    if (new URLSearchParams(location.search).get('theme') === 'dark') {
      document.body.setAttribute('data-ds-dark-theme', '')
    }
  </script>
  <div id="root"></div>
  <script src="/vendor/react.js"></script>
  <script src="/vendor/react-dom.js"></script>
  <script>
    window.__ModuleLoader__ = { load(definition) { window.__MODULE_DEFINITION__ = definition } }
    window.addEventListener('error', (event) => {
      const box = document.createElement('pre')
      box.style.cssText = 'margin:16px;padding:16px;border:1px solid #f00;border-radius:8px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;color:#b00'
      box.textContent = String(event.error?.stack || event.message || event.error || 'unknown error')
      document.body.appendChild(box)
    })
  </script>
  <script src="/client.js"></script>
  <script>
    const definition = window.__MODULE_DEFINITION__
    if (!definition) throw new Error('client.js did not register a module')
    const mod = definition.factory((name) => {
      if (name === 'react') return window.React
      throw new Error(`unexpected require(${name})`)
    })
    let Main = null
    let SidebarEntry = null
    mod.apply({
      get: () => undefined,
      slots: {
        inject: (key, callback) => { callback(); return () => {} },
        register: (position, component) => {
          if (position.name === 'main') Main = component
          // Harness mounts the sidebar entry with the app; mount it here too so
          // the warm-up path runs exactly as it does in the product.
          if (position.name === 'sidebar.panellist') SidebarEntry = component
          return () => {}
        },
      },
    })
    if (!Main) throw new Error('main panel was not registered')
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Main))
    if (SidebarEntry) {
      const holder = document.createElement('div')
      holder.id = 'sidebar-entry'
      holder.style.display = 'none'
      document.body.appendChild(holder)
      ReactDOM.createRoot(holder).render(React.createElement(SidebarEntry))
    }
  </script>
</body>
</html>
